name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # psql: 開発用アダプタ / pg: 本番と同じドライバー（型の違いをここで検出する）
        db_driver: [psql, pg]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: misenare
          POSTGRES_PASSWORD: misenare
          POSTGRES_DB: misenare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U misenare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://misenare:misenare@localhost:5432/misenare_test
      DB_DRIVER: ${{ matrix.db_driver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm install
      - run: npm run typecheck
      - run: npm test
