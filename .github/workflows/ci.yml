name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # psql: 開発用アダプタ / pg: 本番と同じドライバー（型の違いをここで検出する）
        db_driver: [psql, pg]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://misenare:misenare@localhost:5432/misenare_test
      DB_DRIVER: ${{ matrix.db_driver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # アプリは一般ロールで接続する（スーパーユーザーは行レベルセキュリティを素通りするため）
      - name: Create application role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE misenare LOGIN PASSWORD 'misenare' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE misenare_test OWNER misenare"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build:web
      - name: Test
        run: |
          set -o pipefail
          npx tsx --test --test-concurrency=1 --test-reporter=tap \
            packages/*/test/*.test.ts apps/api/test/*.test.ts | tee test-output.tap
      - name: Report failures as annotations
        if: failure()
        run: node .github/scripts/annotate-tap.mjs test-output.tap

  # QR コードは作るだけでは「読めるか」が分からない。別実装の読み取り器で往復させて確かめる。
  # ここでしか使わないので、依存には入れず、この場で入れて動かす。
  qr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install independent QR decoders
        run: npm install --no-save jsqr@1.4.0 @zxing/library@0.21.3
      - name: Verify QR codes can be read back
        run: |
          set -o pipefail
          npx tsx --test --test-reporter=tap packages/qr/test/decode.test.ts | tee qr-output.tap
      - name: Report failures as annotations
        if: failure()
        run: node .github/scripts/annotate-tap.mjs qr-output.tap

  # kuromoji（形態素解析）は辞書が大きく、ここでしか動かさないので別の仕事にする。
  # 入っていないときは Intl.Segmenter に落ちることも、ここで一緒に確かめる。
  kuromoji:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install kuromoji
        run: npm install --no-save kuromoji@0.1.2
      - name: Verify morphological tokenizer
        run: |
          set -o pipefail
          npx tsx --test --test-reporter=tap apps/api/test/kuromoji.test.ts | tee kuromoji-output.tap
      # タグの読みを自動で埋めてよいかの測定。成功しても数字を注記に残す。
      - name: Measure reading accuracy
        run: |
          set -o pipefail
          npx tsx --test --test-reporter=tap apps/api/test/readingBench.test.ts | tee reading-bench.tap
      - name: Publish reading accuracy
        if: always()
        run: node .github/scripts/notice-file.mjs reading-bench.md 'タグの読みの精度'
      - name: Report failures as annotations
        if: failure()
        run: |
          node .github/scripts/annotate-tap.mjs kuromoji-output.tap || true
          [ -f reading-bench.tap ] && node .github/scripts/annotate-tap.mjs reading-bench.tap || true

  # Dockerfile が本当に動くかを、組み立てて起動して確かめる（デプロイはしない）
  docker:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t misenare:ci .
      - name: Create application role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE misenare LOGIN PASSWORD 'misenare' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE misenare OWNER misenare"
      - name: Run migrations in the image
        run: |
          set -o pipefail
          docker run --rm --network host -e DATABASE_URL=postgresql://misenare:misenare@localhost:5432/misenare \
            misenare:ci npx tsx apps/api/src/cli/migrate.ts 2>&1 | tee migrate.log
      - name: Start the container and check it answers
        run: |
          docker run -d --name misenare --network host \
            -e DATABASE_URL=postgresql://misenare:misenare@localhost:5432/misenare \
            -e PORT=8787 -e PHOTO_DIR=/tmp/photos misenare:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/health > /dev/null; then break; fi
            sleep 2
          done
          echo "--- /health ---"
          curl -fsS http://localhost:8787/health
          echo "--- /app/ ---"
          curl -fsS http://localhost:8787/app/ | head -c 200
          echo
          echo "--- /api/me（ログインしていないので 401 のはず）---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/me)" = "401"
      - name: Report failures as annotations
        if: failure()
        run: |
          echo "::error title=docker failed::$( { tail -20 migrate.log 2>/dev/null; docker logs misenare 2>&1 | tail -20; } | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/%0A/g')"
