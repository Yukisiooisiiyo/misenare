name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # psql: 開発用アダプタ / pg: 本番と同じドライバー（型の違いをここで検出する）
        db_driver: [psql, pg]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://misenare:misenare@localhost:5432/misenare_test
      DB_DRIVER: ${{ matrix.db_driver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # アプリは一般ロールで接続する（スーパーユーザーは行レベルセキュリティを素通りするため）
      - name: Create application role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE misenare LOGIN PASSWORD 'misenare' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE misenare_test OWNER misenare"
      # package-lock.json に書いてある版だけを入れる（本番のイメージと同じ）
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - name: Test
        run: |
          set -o pipefail
          npx tsx --test --test-concurrency=1 --test-reporter=tap \
            packages/*/test/*.test.ts apps/api/test/*.test.ts | tee test-output.tap
      - name: Report failures as annotations
        if: failure()
        run: node .github/scripts/annotate-tap.mjs test-output.tap

  # パスキーは、サーバーの試験が全部通っていても実機で入れないことがある。
  # ブラウザに渡す選択肢の形（バイト列の渡し方）と、端末が名前を聞かずに鍵を出せるか
  # （residentKey）は、にせ認証器では確かめられない。Chrome の仮想認証器で通す。
  passkey:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://misenare:misenare@localhost:5432/misenare_e2e
      # localhost は安全な出どころとして扱われるので、証明書なしでパスキーが使える
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGINS: http://localhost:8787
      PORT: '8787'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create application role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE misenare LOGIN PASSWORD 'misenare' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE misenare_e2e OWNER misenare"
      # package-lock.json に書いてある版だけを入れる（本番のイメージと同じ）
      - run: npm ci
      - run: npm run build:web
      - run: npm run db:migrate
      - name: Seed demo data
        run: |
          mkdir -p e2e-out
          npm run seed:demo --silent > e2e-out/seed.txt
          cat e2e-out/seed.txt
      - name: Start the server
        run: |
          npx tsx apps/api/src/server.ts > e2e-out/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8787/health > /dev/null; then echo "起動した"; exit 0; fi
            sleep 1
          done
          echo "::error title=パスキーの通し確認::サーバーが起動しなかった"
          cat e2e-out/server.log
          exit 1
      # Playwright は本番にも試験にも要らないので、依存には入れず、ここで入れる。
      # `playwright install` はブラウザの実体を落とすだけで、import できる形には
      # ならない。初回の失敗はこれだった（サーバーは起動していたのに、台本が
      # playwright を見つけられずに落ちていた）。
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Walk through registration and sign-in
        run: |
          set -o pipefail
          node apps/web/e2e/passkey.mjs e2e-out 2>&1 | tee e2e-out/walk.log
      - name: Report what went wrong
        if: failure()
        run: |
          # 通し確認の失敗は、ログを開かないと中身が分からない。
          # 注記（annotation）に出して、実行の画面を開かずに読めるようにする。
          node .github/scripts/notice-file.mjs e2e-out/walk.log 'パスキーの通し確認' error || true
          node .github/scripts/notice-file.mjs e2e-out/server.log 'サーバーのログ' error || true
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passkey-shots
          path: e2e-out/shots
          if-no-files-found: warn

  # QR コードは作るだけでは「読めるか」が分からない。別実装の読み取り器で往復させて確かめる。
  # ここでしか使わないので、依存には入れず、この場で入れて動かす。
  qr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json に書いてある版だけを入れる（本番のイメージと同じ）
      - run: npm ci
      - name: Install independent QR decoders
        run: npm install --no-save jsqr@1.4.0 @zxing/library@0.21.3
      - name: Verify QR codes can be read back
        run: |
          set -o pipefail
          npx tsx --test --test-reporter=tap packages/qr/test/decode.test.ts | tee qr-output.tap
      - name: Report failures as annotations
        if: failure()
        run: node .github/scripts/annotate-tap.mjs qr-output.tap

  # kuromoji（形態素解析）は辞書が大きく、ここでしか動かさないので別の仕事にする。
  # 入っていないときは Intl.Segmenter に落ちることも、ここで一緒に確かめる。
  kuromoji:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json に書いてある版だけを入れる（本番のイメージと同じ）
      - run: npm ci
      - name: Install kuromoji
        run: npm install --no-save kuromoji@0.1.2
      - name: Verify morphological tokenizer
        run: |
          set -o pipefail
          npx tsx --test --test-reporter=tap apps/api/test/kuromoji.test.ts | tee kuromoji-output.tap
      # タグの読みを自動で埋めてよいかの測定。成功しても数字を注記に残す。
      - name: Measure reading accuracy
        run: |
          set -o pipefail
          npx tsx --test --test-reporter=tap apps/api/test/readingBench.test.ts | tee reading-bench.tap
      - name: Publish reading accuracy
        if: always()
        run: node .github/scripts/notice-file.mjs reading-bench.md 'タグの読みの精度'
      - name: Report failures as annotations
        if: failure()
        run: |
          node .github/scripts/annotate-tap.mjs kuromoji-output.tap || true
          [ -f reading-bench.tap ] && node .github/scripts/annotate-tap.mjs reading-bench.tap || true

  # Dockerfile が本当に動くかを、組み立てて起動して確かめる（デプロイはしない）
  docker:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t misenare:ci .
      - name: Create application role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE misenare LOGIN PASSWORD 'misenare' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE misenare OWNER misenare"
      - name: Run migrations in the image
        run: |
          set -o pipefail
          docker run --rm --network host -e DATABASE_URL=postgresql://misenare:misenare@localhost:5432/misenare \
            misenare:ci npx tsx apps/api/src/cli/migrate.ts 2>&1 | tee migrate.log
      # 資料の読み取りは、本体とは別のプロセスで行う（apps/api/src/import/isolated.ts）。
      # 手元や上の試験では動いても、本番のイメージ（NODE_ENV=production・node の利用者・イメージに入った tsx）で
      # 子プロセスを起こせなければ、取り込みがまるごと使えなくなる。イメージの中で実際に走らせて確かめる
      - name: Read manuals in a separate process inside the image
        run: |
          set -o pipefail
          docker run --rm misenare:ci npx tsx --test --test-reporter=tap apps/api/test/importIsolation.test.ts 2>&1 | tee import-isolation.tap
      # イメージに入った依存が、package-lock.json に書いてある版と同じかを確かめる
      # （Dockerfile が npm install に戻ったり、lockfile を写し忘れたりすると、ここで分かる）
      - name: The image holds exactly the locked versions
        run: |
          set -euo pipefail
          for name in tsx pg esbuild; do
            locked=$(node -e "console.log(require('./package-lock.json').packages['node_modules/$name'].version)")
            inside=$(docker run --rm misenare:ci node -e "console.log(JSON.parse(require('fs').readFileSync('/app/node_modules/$name/package.json', 'utf8')).version)")
            echo "$name: lockfile $locked / イメージ $inside"
            test "$locked" = "$inside"
          done
      # イメージは NODE_ENV=production で動くので、本番と同じ形の設定を渡す。
      # 渡さないと起動時の点検で止まる（それが点検の役目）。
      - name: Refuse to start when the configuration is incomplete
        run: |
          # 点検が本当に止めるかを確かめる。ここが通ってしまうなら、点検が効いていない。
          if docker run --rm --network host \
              -e DATABASE_URL=postgresql://misenare:misenare@localhost:5432/misenare \
              -e PORT=8788 misenare:ci > config-check.log 2>&1; then
            echo "::error title=設定の点検::設定が足りないのに起動してしまった"
            cat config-check.log
            exit 1
          fi
          echo "--- 点検の出力 ---"
          cat config-check.log
          grep -q 'APP_URL' config-check.log || { echo "::error::足りない設定の名前が出ていない"; exit 1; }
      - name: Start the container and check it answers
        run: |
          docker run -d --name misenare --network host \
            -e DATABASE_URL=postgresql://misenare:misenare@localhost:5432/misenare \
            -e PORT=8787 -e PHOTO_DIR=/tmp/photos \
            -e APP_URL=https://misenare.example.com \
            -e METRICS_TOKEN=ci-token \
            misenare:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/health > /dev/null; then break; fi
            sleep 2
          done
          echo "--- /health ---"
          curl -fsS http://localhost:8787/health
          echo "--- /app/ ---"
          curl -fsS http://localhost:8787/app/ | head -c 200
          echo
          echo "--- /api/me（ログインしていないので 401 のはず）---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/me)" = "401"
      # Caddyfile は、書き間違えると入口（https）ごと落ちる。入れ替えの前に、本物の Caddy に読ませて確かめる。
      # 続けて、上で起こしたアプリの前に立てて、守りの見出しが1つずつ付いていることを見る
      - name: Check the Caddyfile and the headers it adds
        run: |
          set -euo pipefail
          docker run --rm -e MISENARE_HOST=app.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          # http の 8080 で立てる（証明書を取りに行かせない）。アプリは同じ台の 8787 にいる
          docker run -d --name caddy-ci --network host --add-host api:127.0.0.1 -e MISENARE_HOST=http://localhost:8080 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/health && break; sleep 1; done
          count() { grep -ci "^$1:" "$2" || true; }
          value() { grep -i "^$1:" "$2" | head -1 | cut -d: -f2- | tr -d '\r' | sed 's/^ *//'; }
          for path in /health /app/ /admin/; do
            curl -sS -D headers.txt -o /dev/null "http://localhost:8080$path"
            echo "--- $path"; grep -iE '^(HTTP/|x-frame-options:|referrer-policy:|strict-transport-security:)' headers.txt
            head -1 headers.txt | grep -q ' 200'
            # 同じ見出しが2つ付くと、どちらが効くかがブラウザーしだいになる。1つずつにする
            test "$(count x-frame-options headers.txt)" = 1
            test "$(count referrer-policy headers.txt)" = 1
            test "$(count strict-transport-security headers.txt)" = 1
            test "$(value x-frame-options headers.txt)" = DENY
            test "$(value strict-transport-security headers.txt)" = max-age=31536000
          done
          # アプリが自分で決めているもの（画面は no-referrer）はそのまま通し、決めていないもの（API）には Caddy が付ける
          curl -sS -D headers.txt -o /dev/null http://localhost:8080/app/
          test "$(value referrer-policy headers.txt)" = no-referrer
          curl -sS -D headers.txt -o /dev/null http://localhost:8080/health
          test "$(value referrer-policy headers.txt)" = strict-origin-when-cross-origin
          docker rm -f caddy-ci > /dev/null
      # 退避（deploy/backup/backup.sh）が、本番と同じ compose の中で取れて、そこから戻せることを確かめる。
      # 試していない退避は無いのと同じなので、台本を変えるたびに、取る → 壊す → 戻す → アプリが起動する、を通す
      - name: Back up and restore inside the compose stack
        working-directory: deploy
        run: |
          set -euo pipefail
          printf '%s\n' 'DB_ADMIN_PASSWORD=ci-admin-pass' 'DB_APP_PASSWORD=ci-app-pass' 'MISENARE_HOST=localhost' \
            'APP_URL=https://misenare.example.com' 'METRICS_TOKEN=ci-token' > .env
          docker compose up -d db
          docker compose run --rm api npx tsx apps/api/src/cli/migrate.ts > /dev/null
          docker compose run --rm api npx tsx apps/api/src/cli/seed-demo.ts > /dev/null
          # 写真を1枚置く（退避は、できて1分たった写真だけを写すので、時刻を戻しておく）
          docker compose run --rm --user root --entrypoint sh api -c \
            'mkdir -p /var/misenare/photos/ci && echo photo > /var/misenare/photos/ci/a.webp && touch -d "5 minutes ago" /var/misenare/photos/ci/a.webp && chown -R node:node /var/misenare/photos'
          count() { docker compose exec -T db psql -U postgres -d misenare -At -c "SELECT count(*) FROM $1"; }
          before="$(count tenants) $(count users) $(count knowledge) $(count knowledge_versions)"
          echo "取る前（会社・利用者・ナレッジ・版）: $before"
          test "$(count knowledge)" -gt 0

          echo "--- 取る（サービスを起こすと、退避が1つも無いので、その場で1回取る）"
          docker compose up -d backup
          for i in $(seq 1 30); do docker compose exec -T backup test -s /status/status.json && break; sleep 2; done
          docker compose exec -T backup bash /opt/backup/backup.sh status | tee backup-status.txt
          grep -q '^退避: 成功' backup-status.txt
          docker compose exec -T backup test -f /backups/photos/ci/a.webp
          docker compose exec -T backup bash /opt/backup/backup.sh verify --strict

          echo "--- アプリからは結果だけが読めて、退避そのものは見えない"
          docker compose run --rm api node -e "const s = JSON.parse(require('fs').readFileSync(process.env.BACKUP_STATUS_FILE, 'utf8')); if (s.ok !== true) process.exit(1); console.log('アプリから読めた:', s.finishedAt)"
          docker compose run --rm api sh -c 'ls /backups 2>/dev/null && exit 1; ! touch /var/misenare/backup-status/x 2>/dev/null'

          echo "--- 壊してから、戻す"
          docker compose exec -T db psql -U postgres -d misenare -q -c 'TRUNCATE tenants CASCADE'
          test "$(count knowledge)" = 0
          file=$(docker compose exec -T backup bash /opt/backup/backup.sh list | tail -1 | cut -f1)
          docker compose exec -T -e CONFIRM=misenare backup bash /opt/backup/backup.sh restore "$file"
          after="$(count tenants) $(count users) $(count knowledge) $(count knowledge_versions)"
          echo "戻した後（会社・利用者・ナレッジ・版）: $after"
          test "$before" = "$after"

          echo "--- 戻したデータベースで、アプリが起動する（起動のときに、行レベルセキュリティが効いているかを自分で確かめる）"
          docker compose up -d api
          ready() { docker compose exec -T api node -e "fetch('http://127.0.0.1:8787/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; }
          for i in $(seq 1 30); do ready && break; sleep 2; done
          ready
          docker compose logs --tail 5 api

          echo "--- 写真を消してから、写しから戻す"
          docker compose exec -T --user root api rm /var/misenare/photos/ci/a.webp
          docker compose run --rm --entrypoint bash -v misenare_photos:/restore backup /opt/backup/backup.sh restore-photos /restore
          test "$(docker compose exec -T api cat /var/misenare/photos/ci/a.webp)" = photo
          # 戻した写真は、アプリの利用者（node）の持ち物のまま
          test "$(docker compose exec -T api stat -c %U /var/misenare/photos/ci/a.webp)" = node
      # 入れ替えの台本（deploy/deploy.sh）を、本番と同じ compose の中でそのまま走らせる。
      # 本番でしか走らない台本は、間違っていても気づけない（前は、Caddyfile を変えても Caddy が作り直されていなかった）。
      # ここまでの手順で、DB・アプリ・退避が動いている。そこに「新しい版を入れる」ことを、場合を変えて5回やる
      - name: Rehearse the deploy script
        working-directory: deploy
        run: |
          set -euo pipefail
          id_of() { docker compose ps -q "$1"; }
          # 入口が返した見出しを headers.txt に取る（つなぎながら grep に流すと、途中で切れたときの結果が分かりにくい）
          entrance() { curl -sk -o /dev/null -D - https://localhost/health | tr -d '\r' > headers.txt; }
          has_rehearsal_header() { entrance; grep -qi '^x-rehearsal: 1$' headers.txt; }

          echo "=== 1回目：全部を起こす（Caddy と夜間バッチは、ここで初めて起きる）"
          sudo bash deploy.sh
          entrance
          cat headers.txt
          head -1 headers.txt | grep -q ' 200'
          grep -qi '^strict-transport-security: max-age=31536000$' headers.txt
          test "$(grep -ci '^x-frame-options:' headers.txt)" = 1
          test "$(grep -ci '^referrer-policy:' headers.txt)" = 1
          api=$(id_of api); caddy=$(id_of caddy); backup=$(id_of backup); batch=$(id_of batch); db=$(id_of db)
          test -n "$api" && test -n "$caddy" && test -n "$backup" && test -n "$batch" && test -n "$db"

          echo "=== 2回目：何も変えていなければ、何も作り直さない"
          sudo bash deploy.sh
          test "$api $caddy $backup $batch $db" = "$(id_of api) $(id_of caddy) $(id_of backup) $(id_of batch) $(id_of db)"

          echo "=== Caddyfile を変える → Caddy だけを作り直す"
          cp Caddyfile Caddyfile.orig
          # git が置き換えるのと同じやり方（別のファイルを作って、名前を付け替える）
          sed 's|Strict-Transport-Security "max-age=31536000"|&\n\t\tX-Rehearsal "1"|' Caddyfile.orig > Caddyfile.new
          mv Caddyfile.new Caddyfile
          sudo bash deploy.sh
          test "$(id_of caddy)" != "$caddy"
          test "$api $backup $batch $db" = "$(id_of api) $(id_of backup) $(id_of batch) $(id_of db)"
          has_rehearsal_header
          caddy=$(id_of caddy)

          echo "=== 書き間違えた Caddyfile → 何も入れ替えずに止まる（入口は、前のまま応える）"
          printf '%s\n' '{$MISENARE_HOST} {' '	this_is_not_a_directive' > Caddyfile.new
          mv Caddyfile.new Caddyfile
          if sudo bash deploy.sh > broken.log 2>&1; then
            echo "::error title=入れ替えの台本::書き間違えた Caddyfile なのに、入れ替えが通ってしまった"
            cat broken.log
            exit 1
          fi
          tail -4 broken.log
          test "$api $caddy $backup $batch $db" = "$(id_of api) $(id_of caddy) $(id_of backup) $(id_of batch) $(id_of db)"
          has_rehearsal_header

          echo "=== 元に戻す（その場で書き換える）→ Caddy を作り直して、元の中身になる"
          cat Caddyfile.orig > Caddyfile
          sudo bash deploy.sh
          test "$(id_of caddy)" != "$caddy"
          if has_rehearsal_header; then echo "::error title=入れ替えの台本::Caddyfile を戻したのに、前の中身のまま"; exit 1; fi
          caddy=$(id_of caddy)

          echo "=== アプリを変える → アプリと夜間バッチを作り直す（Caddy・DB・退避は、そのまま）"
          echo '// 入れ替えの通し確認' >> ../apps/api/src/server.ts
          sudo bash deploy.sh
          test "$(id_of api)" != "$api"
          test "$(id_of batch)" != "$batch"
          test "$caddy $backup $db" = "$(id_of caddy) $(id_of backup) $(id_of db)"
          # 夜間バッチは口を開けないので、「動いているかの確認」は切ってある（unhealthy と出ない）
          test "$(docker inspect -f '{{ if .State.Health }}{{ .State.Health.Status }}{{ else }}none{{ end }}' "$(id_of batch)")" = none
      - name: Report failures as annotations
        if: failure()
        run: |
          (cd deploy && docker compose logs --tail 40 backup db api caddy 2>/dev/null) || true
          docker logs caddy-ci 2>&1 | tail -20 || true
