name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # psql: 開発用アダプタ / pg: 本番と同じドライバー（型の違いをここで検出する）
        db_driver: [psql, pg]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://misenare:misenare@localhost:5432/misenare_test
      DB_DRIVER: ${{ matrix.db_driver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # アプリは一般ロールで接続する（スーパーユーザーは行レベルセキュリティを素通りするため）
      - name: Create application role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE misenare LOGIN PASSWORD 'misenare' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE misenare_test OWNER misenare"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build:web
      - name: Test
        run: |
          set -o pipefail
          npx tsx --test --test-concurrency=1 --test-reporter=tap \
            packages/*/test/*.test.ts apps/api/test/*.test.ts | tee test-output.tap
      - name: Report failures as annotations
        if: failure()
        run: node .github/scripts/annotate-tap.mjs test-output.tap

  # QR コードは作るだけでは「読めるか」が分からない。別実装の読み取り器で往復させて確かめる。
  # ここでしか使わないので、依存には入れず、この場で入れて動かす。
  qr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install an independent QR decoder
        run: npm install --no-save jsqr@1.4.0
      - name: Verify QR codes can be read back
        run: npx tsx --test packages/qr/test/decode.test.ts
