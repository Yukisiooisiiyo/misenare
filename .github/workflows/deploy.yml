name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the VM over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -eu
            cd /opt/misenare
            sudo git pull --ff-only
            cd deploy
            # 新しいイメージを先に作る（マイグレーションのファイルも取り込まれる）
            sudo docker compose build
            # DB を起動（すでに動いていれば何もしない）
            sudo docker compose up -d db
            # スキーマのマイグレーションを、新しいイメージで適用してからアプリを入れ替える。
            # 失敗したら script_stop でここで止まり、アプリは旧版のまま（壊れた新版を出さない）。
            sudo docker compose run --rm api npx tsx apps/api/src/cli/migrate.ts
            # アプリ・バッチ・Caddy を新イメージで起動
            sudo docker compose up -d
            sudo docker image prune -f
