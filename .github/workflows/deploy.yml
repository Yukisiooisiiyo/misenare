name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the VM over SSH
        # このアクションには、本番の台に入る鍵を渡している。タグ（v1.0.3）は付け替えられるので、中身の決まるコミットで指す。
        # このコミットの Dockerfile は、実行するイメージもダイジェストで固定している（ghcr.io/appleboy/drone-ssh:1.7.3@sha256:…）。
        # 版を上げるときは、新しいタグのコミットを確かめてから書き換える
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -eu
            cd /opt/misenare
            sudo git pull --ff-only
            # 入れ替えの中身は deploy/deploy.sh にある（いま取り出した、新しい版の台本を使う）。
            # 前はここに直に書いていたが、本番でしか走らないので、間違いに気づけなかった
            # （Caddyfile を変えても Caddy が作り直されていなかった）。台本に出して、CI が同じものを走らせて確かめる
            sudo bash deploy/deploy.sh
