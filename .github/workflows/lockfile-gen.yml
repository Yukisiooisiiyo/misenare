# 一時的な作業用。package-lock.json を作って、この枝に置くだけ（main には入れない）。
name: lockfile-gen

on:
  push:
    branches: [chore/lockfile-gen]

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create package-lock.json
        run: |
          node -v
          npm -v
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          ls -la package-lock.json
      # 作ったものが、そのまま npm ci で入るかを確かめてから置く
      - name: Check that npm ci accepts it
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build:web
      - name: Keep it on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -q -m "package-lock.json（作業用の枝に置く）"
          git push -q
          echo "::notice title=lockfile::$(wc -c < package-lock.json) バイト、node $(node -v)、npm $(npm -v)"
